name: 테스트

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v

      - name: 설정 파일 유효성
        run: python -c "from src.config import load_sources; c = load_sources(); print(f'카테고리 {len(c.categories)}개, 피드 {sum(len(x.feeds) for x in c.categories)}개')"
